name: eldercare-cloud

x-postgres-credentials: &postgres-credentials
  POSTGRES_USER: ${POSTGRES_USER:?请在 .env 中配置 POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:?请在 .env 中配置 POSTGRES_DB}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *postgres-credentials
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 5432 不映射到宿主机（规格要求 PostgreSQL 不对外开放）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      MQTT_USER: ${MQTT_USER:?请在 .env 中配置 MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?请在 .env 中配置 MQTT_PASSWORD}
    entrypoint: ["/bin/sh", "/mosquitto/scripts/entrypoint.sh"]
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/scripts/entrypoint.sh:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "1883:1883"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h 127.0.0.1 -u \"$${MQTT_USER}\" -P \"$${MQTT_PASSWORD}\" -t healthcheck -m ok -q 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 一次性迁移任务：每次启动把数据库升级到最新版本后退出
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MQTT_USER: ${MQTT_USER:?请在 .env 中配置 MQTT_USER}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?请在 .env 中配置 MQTT_PASSWORD}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      # LoRa 桥接：默认订阅 ChirpStack v4 上行；源 Broker 凭据留空时复用平台 MQTT 账号
      LORA_TOPIC: ${LORA_TOPIC:-application/+/device/+/event/up}
      LORA_UID_PREFIX: ${LORA_UID_PREFIX:-}
      LORA_SOURCE_MQTT_HOST: ${LORA_SOURCE_MQTT_HOST:-mosquitto}
      LORA_SOURCE_MQTT_PORT: ${LORA_SOURCE_MQTT_PORT:-1883}
      LORA_SOURCE_MQTT_USER: ${LORA_SOURCE_MQTT_USER:-}
      LORA_SOURCE_MQTT_PASSWORD: ${LORA_SOURCE_MQTT_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
      SEED_FAMILY_USERNAME: ${SEED_FAMILY_USERNAME:-family}
      SEED_FAMILY_PASSWORD: ${SEED_FAMILY_PASSWORD:-family123456}
    # 宿主机端口可配置：默认 18080（避开 Steam/Tomcat 常占用的 8080），可在 .env 中改 BACKEND_PORT
    ports:
      - "${BACKEND_PORT:-18080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
        NEXT_PUBLIC_DEMO_LOGIN_ENABLED: ${NEXT_PUBLIC_DEMO_LOGIN_ENABLED:-true}
        NEXT_PUBLIC_DEMO_ADMIN_USERNAME: ${NEXT_PUBLIC_DEMO_ADMIN_USERNAME:-admin}
        NEXT_PUBLIC_DEMO_ADMIN_PASSWORD: ${NEXT_PUBLIC_DEMO_ADMIN_PASSWORD:-admin123456}
        NEXT_PUBLIC_DEMO_FAMILY_USERNAME: ${NEXT_PUBLIC_DEMO_FAMILY_USERNAME:-family}
        NEXT_PUBLIC_DEMO_FAMILY_PASSWORD: ${NEXT_PUBLIC_DEMO_FAMILY_PASSWORD:-family123456}
    # 管理台对外端口：默认 3000，被占用时在 .env 中改 FRONTEND_PORT
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  mosquitto_data:
